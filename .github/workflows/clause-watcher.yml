# Vigila las subidas de cláusula de la liga.
#
# Corre cada hora porque la detección solo es válida entre dos instantáneas del
# mismo día: la revalorización automática de LaLiga, de madrugada, hace
# inatribuible cualquier intervalo que la cruce. Con una foto por hora, la única
# pareja descartada es la que rodea esa franja y todas las demás sirven.
name: Vigilar cláusulas

on:
  schedule:
    - cron: '7 * * * *'   # cada hora, en el minuto 7 (evita el pico en punto)
  workflow_dispatch:       # también se puede lanzar a mano

concurrency:
  group: clause-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  vigilar:
    runs-on: ubuntu-latest
    # El secreto se expone como variable del job porque el contexto `secrets`
    # no se puede usar en el `if` de un paso, y ese paso debe saber si existe.
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tomar instantánea de cláusulas
        env:
          LALIGA_REFRESH_TOKEN: ${{ secrets.LALIGA_REFRESH_TOKEN }}
          LALIGA_LEAGUE_ID: ${{ secrets.LALIGA_LEAGUE_ID }}
          # Opcionales: sin ellos el vigilante sigue funcionando, solo que sin
          # mandar avisos.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LALIGA_TEAM_ID: ${{ secrets.LALIGA_TEAM_ID }}
        run: node scripts/clause-watcher.mjs

      # El proveedor rota el refresh token en cada uso, e invalida el anterior
      # en cuanto responde. Por eso este paso corre SIEMPRE, incluso si el de
      # arriba ha fallado: si no, un fallo posterior dejaría el secreto con un
      # token ya muerto y todas las ejecuciones siguientes caerían con
      # invalid_grant sin causa aparente.
      - name: Actualizar el refresh token rotado
        if: ${{ always() && hashFiles('.refresh-token-nuevo') != '' && env.GH_PAT != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set LALIGA_REFRESH_TOKEN --body "$(cat .refresh-token-nuevo)"
          rm -f .refresh-token-nuevo
          echo "Secreto LALIGA_REFRESH_TOKEN actualizado."

      - name: Guardar los cambios
        run: |
          rm -f .refresh-token-nuevo
          # `git status --porcelain`, no `git diff`: en la primera ejecución el
          # fichero de estado aún no está en el repositorio, y git diff ignora
          # lo que no tiene seguimiento. Con diff, la primera instantánea se
          # perdía y el vigilante no llegaba a arrancar nunca.
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git config user.name  "clause-watcher"
          git config user.email "clause-watcher@users.noreply.github.com"
          git add data/
          git commit -m "Instantánea de cláusulas $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
